<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a24">
<title>جدول التمارين 💜</title>
<style>
:root{
  --bg:#0f0a24; --bg2:#1a1240; --card:rgba(124,92,255,.10); --line:rgba(167,139,250,.35);
  --violet:#a78bfa; --purple:#7c3aed; --blue:#60a5fa; --deep:#2563eb; --text:#f3efff; --mute:#b9aee6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;line-height:1.6;
  background:radial-gradient(900px 500px at 90% -10%,rgba(124,58,237,.45),transparent 60%),
             radial-gradient(800px 500px at -10% 30%,rgba(37,99,235,.35),transparent 60%),var(--bg);
  background-attachment:fixed;
  padding:0 0 calc(96px + env(safe-area-inset-bottom,0px));
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:28px 0 8px}
h1{margin:0;font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:0;
  background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.4);color:#cfe3ff;border-radius:999px;padding:4px 14px;font-size:14px}

.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:18px;align-items:stretch}
.sched{border-radius:26px;overflow:hidden;border:2px solid var(--line);background:#000;box-shadow:0 0 40px rgba(124,58,237,.35)}
.sched img{display:block;width:100%;height:100%;object-fit:contain}
.days{display:grid;gap:10px;align-content:center}
.days button{font:inherit;font-size:19px;font-weight:700;color:var(--text);cursor:pointer;border-radius:20px;padding:12px 16px;text-align:right;
  border:1.5px solid var(--line);background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(37,99,235,.28));
  display:flex;justify-content:space-between;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.days button small{font-size:13px;font-weight:500;color:var(--mute)}
.days button:active{transform:scale(.97)}
.days button:hover{box-shadow:0 0 22px rgba(167,139,250,.45)}
@media(max-width:700px){.hero{grid-template-columns:1fr}.days{grid-template-columns:1fr 1fr}.days button:last-child{grid-column:1/-1}}

.day{margin-top:34px;scroll-margin-top:12px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 20px;border-radius:24px;background:linear-gradient(120deg,var(--purple),var(--deep));box-shadow:0 8px 30px rgba(76,29,149,.5)}
.day-head h2{margin:0;font-size:26px}
.day-head span{font-size:15px;opacity:.9}
.top{font:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,.35);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.note{margin:12px 4px;color:var(--mute);font-size:15px;border-right:3px solid var(--blue);padding-right:10px}

.ex{margin-top:16px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);padding:16px;backdrop-filter:blur(6px);transition:border-color .2s,background .2s}
.ex.done{border-color:var(--blue);background:rgba(96,165,250,.12)}
.ex-top{display:flex;align-items:center;gap:12px}
.ttl{flex:1;min-width:0}
.ex-top h3{margin:0;font-size:20px;direction:ltr;text-align:right;font-weight:700}
.sets{margin:2px 0 0;font-size:14px;color:var(--blue);font-weight:600}
.check{width:46px;height:46px;flex:none;border-radius:50%;border:2.5px solid var(--violet);background:transparent;color:transparent;font-size:26px;cursor:pointer;display:grid;place-items:center;transition:all .2s}
.ex.done .check{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:transparent;color:#fff;box-shadow:0 0 18px rgba(96,165,250,.6)}
.media{margin:14px auto 0;max-width:340px;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line)}
.media video,.media img{display:block;width:100%;max-height:62vh;object-fit:contain;background:#000}
.log{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.log label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.log input{width:100%;font:inherit;font-size:18px;color:var(--text);text-align:center;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:rgba(0,0,0,.35);outline:none}
.log input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(96,165,250,.25)}

.bar{position:fixed;inset:auto 0 0 0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(10,6,28,.92);border-top:1.5px solid var(--line);backdrop-filter:blur(10px)}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer{flex:1;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;text-align:center;
  background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:999px;padding:11px 24px;cursor:pointer;color:#fff}
.start{background:linear-gradient(135deg,var(--purple),var(--deep))}
.finish{background:linear-gradient(135deg,#1e1b4b,#000);border:1.5px solid var(--violet)}
.btn[hidden]{display:none}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(5,2,20,.85);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:28px;padding:22px;background:linear-gradient(160deg,#1e1450,#0a0620);border:2px solid var(--violet);box-shadow:0 0 50px rgba(124,58,237,.6)}
.sheet h2{margin:0 0 4px;text-align:center;font-size:26px}
.total{text-align:center;font-size:44px;font-weight:800;direction:ltr;background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sum-day{margin-top:14px;font-weight:700;color:var(--blue)}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;margin-top:6px;border-radius:14px;background:rgba(124,92,255,.15)}
.sum-row b{direction:ltr;font-weight:600}
.sum-row span{color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);margin:16px 0}
.sheet .row{display:flex;gap:10px;margin-top:18px}
.sheet .btn{flex:1}
.ghost{background:transparent;border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <h1>جدول التمارين 💜</h1>
    <div class="chips"><span class="chip">3 مجاميع × 12 إلى 15 عدة</span><span class="chip">راحة 60 ثانية بين المجاميع</span></div>
  </header>
  <section class="hero">
    <div class="sched"><img src="schedule.jpg" alt="جدول التمارين"></div>
    <nav class="days" id="dayNav" aria-label="الأيام"></nav>
  </section>
  <main id="days"></main>
</div>

<div class="bar">
  <div class="bar-in">
    <button class="btn start" id="startBtn">ابدأ ✨</button>
    <div class="timer" id="timer">00:00</div>
    <button class="btn finish" id="finishBtn">إنهاء 🏁</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>خلصتي! 🎉</h2>
    <div class="total" id="total">00:00</div>
    <div id="summary"></div>
    <div class="row">
      <button class="btn start" id="closeBtn">رجوع</button>
      <button class="btn ghost" id="resetBtn">ابدأي من جديد</button>
    </div>
  </div>
</div>

<script>
var DAYS=[
{id:'sun',name:'الأحد',sub:'رجل وأرداف',warm:'إحماء: مشي 5 إلى 10 دقايق',cool:'مشي 5 دقايق',ex:[
 ['Goblet Squat','goblet-squat'],['Leg Press','leg-press'],['Glute Bridge','glute-bridge'],['Romanian Deadlift','romanian-deadlift'],['Calf Raise','calf-raise']]},
{id:'mon',name:'الاثنين',sub:'جسم علوي',warm:'إحماء: مشي 5 إلى 10 دقايق',cool:'مشي 5 دقايق',ex:[
 ['Lat Pulldown','lat-pulldown'],['Chest Press (Machine)','chest-press'],['Shoulder Press','shoulder-press'],['Seated Row','seated-row']]},
{id:'tue',name:'الثلاثاء',sub:'رجل + بطن',warm:'إحماء: مشي 5 إلى 10 دقايق',cool:'مشي 5 دقايق',ex:[
 ['Squat','squat'],['Walking Lunges','walking-lunges'],['Leg Extension','leg-extension'],['Leg Curl','leg-curl'],['Hip Thrust','hip-thrust'],
 ['Plank','plank','img'],['Crunches','crunches'],['Leg Raises','leg-raises'],['Russian Twist','russian-twist'],['Dead Bug','dead-bug']]},
{id:'wed',name:'الأربعاء',sub:'كارديو + بطن',warm:'إحماء: مشي 5 إلى 10 دقايق',cool:'مشي 5 دقايق',
 intro:'Light Cardio من 25 إلى 30 دقيقة، وبعدها تمارين البطن.',ex:[
 ['Plank','plank','img'],['Bicycle Crunches','bicycle-crunches'],['Mountain Climbers','mountain-climbers']]},
{id:'thu',name:'الخميس',sub:'أرداف وهب ديبس',warm:'إحماء: مشي 5 إلى 10 دقايق',cool:'مشي 5 دقايق',ex:[
 ['Side-Lying Leg Raises','side-lying-leg-raises'],['Clamshells','clamshells'],['Side Plank','side-plank'],['Cable Kickbacks','cable-kickbacks'],['Step-Ups','step-ups']]}
];
var KEY='workout-v1', S={start:null,end:null,done:{}};
try{var raw=localStorage.getItem(KEY); if(raw)S=JSON.parse(raw);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var nav=$('dayNav'), main=$('days');
DAYS.forEach(function(d){
  var b=document.createElement('button');
  b.innerHTML='<span>'+d.name+'</span><small>'+d.sub+'</small>';
  b.onclick=function(){$('d-'+d.id).scrollIntoView({behavior:'smooth',block:'start'})};
  nav.appendChild(b);
  var sec=document.createElement('section'); sec.className='day'; sec.id='d-'+d.id;
  var h='<div class="day-head"><div><h2>'+d.name+'</h2><span>'+d.sub+'</span></div><button class="top" onclick="document.getElementById(\'top\').scrollIntoView()">↑ الجدول</button></div>';
  h+='<p class="note">'+d.warm+'</p>'; if(d.intro)h+='<p class="note">'+d.intro+'</p>';
  d.ex.forEach(function(e,i){
    var id=d.id+i, st=S.done[id]||{};
    var media=e[2]==='img'?'<img src="videos/'+e[1]+'.webp" alt="'+esc(e[0])+'">'
      :'<video controls playsinline loop preload="metadata" src="videos/'+e[1]+'.mp4#t=0.1"></video>';
    h+='<article class="ex'+(st.c?' done':'')+'" id="'+id+'" data-name="'+esc(e[0])+'" data-day="'+d.name+'">'
      +'<div class="ex-top"><button class="check" aria-label="تم" aria-pressed="'+(!!st.c)+'">✓</button><div class="ttl"><h3>'+esc(e[0])+'</h3><p class="sets">3 مجاميع × 12 إلى 15 عدة</p></div></div>'
      +'<div class="media">'+media+'</div>'
      +'<div class="log"><div><label>أعلى وزن (كجم)</label><input inputmode="decimal" data-f="w" value="'+esc(st.w||'')+'"></div>'
      +'<div><label>عدد العدّات</label><input inputmode="numeric" data-f="r" value="'+esc(st.r||'')+'"></div></div></article>';
  });
  h+='<p class="note">'+d.cool+'</p>';
  sec.innerHTML=h; main.appendChild(sec);
});

function ensureStart(){ if(!S.start){S.start=Date.now();S.end=null;save();tick();} }
main.addEventListener('click',function(e){
  var c=e.target.closest('.check'); if(!c)return;
  var a=c.closest('.ex'), st=S.done[a.id]||(S.done[a.id]={});
  st.c=!st.c; a.classList.toggle('done',st.c); c.setAttribute('aria-pressed',st.c);
  if(st.c)ensureStart(); save();
});
main.addEventListener('input',function(e){
  var i=e.target; if(!i.dataset.f)return;
  var a=i.closest('.ex'), st=S.done[a.id]||(S.done[a.id]={});
  st[i.dataset.f]=i.value; if(i.value)ensureStart(); save();
});
main.addEventListener('play',function(e){ // video one at a time
  document.querySelectorAll('video').forEach(function(v){if(v!==e.target)v.pause()});
},true);

function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  var p=function(n){return n<10?'0'+n:n}; return (h?h+':':'')+p(m)+':'+p(r)}
function tick(){
  var el=$('timer'); if(!S.start){el.textContent='00:00';return}
  el.textContent=fmt((S.end||Date.now())-S.start);
  $('startBtn').hidden=true;
}
setInterval(tick,1000); tick();
$('startBtn').onclick=function(){ensureStart()};

$('finishBtn').onclick=function(){
  if(!S.start){S.start=Date.now()}
  S.end=S.end||Date.now(); save(); tick();
  $('total').textContent=fmt(S.end-S.start);
  var out='', n=0;
  DAYS.forEach(function(d){
    var rows='';
    document.querySelectorAll('#d-'+d.id+' .ex').forEach(function(a){
      var st=S.done[a.id]; if(!st||!st.c)return; n++;
      var bits=[]; if(st.w)bits.push(esc(st.w)+' كجم'); if(st.r)bits.push(esc(st.r)+' عدّة');
      rows+='<div class="sum-row"><b>'+a.dataset.name+'</b><span>'+(bits.join(' × ')||'تم')+'</span></div>';
    });
    if(rows)out+='<div class="sum-day">'+d.name+'</div>'+rows;
  });
  $('summary').innerHTML=out||'<p class="empty">لسه ما علّمتيش أي تمرين.</p>';
  $('overlay').classList.add('on');
};
$('closeBtn').onclick=function(){$('overlay').classList.remove('on')};
$('resetBtn').onclick=function(){
  if(!confirm('هتتمسح كل الأوزان والعدّات والوقت. متأكدة؟'))return;
  S={start:null,end:null,done:{}}; save(); location.reload();
};
</script>
</body>
</html>
